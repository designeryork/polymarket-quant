name: Polymarket 10U Autonomous Quant Loop

on:
  schedule:
    # 每 10 分钟在云端自动巡检一次 (0 成本)
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: polymarket-quant-single-runner
  cancel-in-progress: false

jobs:
  quant-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Private Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install py-clob-client eth-account web3 python-dotenv requests numpy

      - name: Run Single Quant Cycle (Fail-Closed)
        env:
          WALLET_ADDRESS: ${{ secrets.WALLET_ADDRESS }}
          DEPOSIT_WALLET: ${{ secrets.DEPOSIT_WALLET }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          CLOB_API_KEY: ${{ secrets.CLOB_API_KEY }}
          CLOB_SECRET: ${{ secrets.CLOB_SECRET }}
          CLOB_PASSPHRASE: ${{ secrets.CLOB_PASSPHRASE }}
          # 默认必须是 PAPER。GitHub Runner 与本机不在同一台机器，
          # 因此单实例锁（state/engine.lock）无法阻止两端同时实盘下单。
          # 除非显式在仓库 Secrets 中同时设置 PAPER=false 与 ALLOW_LIVE=true，
          # 否则云端只做只读巡检，绝不提交订单。
          PAPER: ${{ secrets.PAPER || 'true' }}
          ALLOW_LIVE: ${{ secrets.ALLOW_LIVE || 'false' }}
        run: |
          python quant_engine.py

      - name: Persist Portfolio State & Dashboard
        run: |
          git config user.name "polymarket-quant-bot"
          git config user.email "bot@users.noreply.github.com"
          # state/ 与 logs/ 已被 .gitignore 排除，需用 -f 显式加入，
          # 否则 git add 会因 "ignored by one of your .gitignore files" 直接失败。
          git add -f state/portfolio.json state/portfolio_paper.json dashboard.html || true
          git add -f logs/signals_and_skips.jsonl || true
          git diff --staged --quiet || git commit -m "chore: update quant state [skip ci]"
          git push
