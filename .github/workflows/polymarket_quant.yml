name: Polymarket Paper Trading (Cloud, 24/7)

# ============================================================================
# 为什么用"长驻 job + 自续跑"，而不是纯 cron
# ----------------------------------------------------------------------------
# GitHub 官方限制：定时 workflow 最短间隔是 5 分钟（cron 下限），
# 写 '*/1 * * * *' 不会被调度 —— GitHub 直接忽略低于 5 分钟的间隔。
# 所以"每分钟一轮"没法只靠 cron 实现。
#
# 方案：cron 每 5 小时触发一次 → job 内部用 quant_engine.py --loop --interval 60
#       连续跑 5 小时（每分钟一轮）→ 结束时用 workflow_dispatch 立刻触发下一轮，
#       形成不断链的自续跑。GitHub 托管 runner 单个 job 最长 6 小时，
#       这里取 5 小时留出安全余量，cron 作为兜底（万一自续跑失败）。
#
# 状态持久化：状态不进 master（master 只放代码，历史干净）。
#       引擎产出的账本/面板通过 sync_state.py 推到独立的 state-snapshot 分支，
#       该分支每次 --force 覆盖，仓库体积恒定，不会随运行时间膨胀。
#
# 安全：PAPER=true + ALLOW_LIVE=false 双保险，云端绝不可能下真单。
# ============================================================================

on:
  schedule:
    # 每 5 小时整点后 7 分钟触发（避开整点高峰，GitHub 建议错开）
    - cron: '7 */5 * * *'
  workflow_dispatch:
    inputs:
      hours:
        description: '本次连续运行多少小时（默认 5）'
        required: false
        default: '5'

# 同一时间只允许一个巡检实例：新一轮必须等上一轮结束，避免账本并发写坏
concurrency:
  group: polymarket-paper-cloud
  cancel-in-progress: false

permissions:
  contents: write
  # 自续跑需要用 GITHUB_TOKEN 触发 workflow_dispatch。
  # 注意：workflow_dispatch 是"GITHUB_TOKEN 触发的 run 不再递归触发"的唯一例外，
  # 所以自续跑链路是通的（push/pull_request 事件则会被 GitHub 拦截）。
  actions: write

jobs:
  paper-loop:
    runs-on: ubuntu-latest
    # 单 job 上限 6 小时；留余量给状态推送与收尾
    timeout-minutes: 330
    env:
      # ---- 纸盘模式：绝不允许真实下单 ----
      PAPER: 'true'
      ALLOW_LIVE: 'false'
      ALLOW_DIRECT: 'true'          # 云端 Runner 无本地代理，允许显式直连
      SCAN_LIMIT: '60'              # 每轮评估的市场数
      ROUND_BUDGET_SECONDS: '240'   # 单轮请求时间预算
      ENGINE_INTERVAL: '60'         # 引擎循环间隔（秒）= 每分钟一轮

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # sync_state 需要读写已有分支

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore State From Snapshot Branch
        # 上一轮结束时推的状态在这里恢复，账本与净值曲线得以连续。
        # 注意：state/ 已被 .gitignore 排除且已从 master 移除，
        # checkout 后该目录不存在 —— 必须先 mkdir，否则重定向会失败。
        run: |
          mkdir -p state logs
          # 显式更新远程跟踪引用：state-snapshot 是 --force 推送的，
          # 普通 `git fetch origin state-snapshot` 只写 FETCH_HEAD，
          # refs/remotes/origin/state-snapshot 会停留在旧快照上。
          git fetch --depth 1 origin \
            +refs/heads/state-snapshot:refs/remotes/origin/state-snapshot || true
          if git show origin/state-snapshot:state/portfolio_paper.json > /dev/null 2>&1; then
            git show origin/state-snapshot:state/portfolio_paper.json > state/portfolio_paper.json
            git show origin/state-snapshot:state/equity_history_paper.jsonl > state/equity_history_paper.jsonl || true
            git show origin/state-snapshot:state/scan_rotation.json > state/scan_rotation.json || true
            echo "已恢复上一轮纸盘状态"
          else
            echo "无历史快照（首次运行），从初始账本开始"
          fi

      - name: Run Paper Loop
        # cloud_runner.py 负责三件事：
        #   1. 后台跑 quant_engine.py --loop --interval 60（每分钟一轮）
        #   2. 每 5 分钟推一次状态快照 —— 即使 job 中途崩溃也只丢几分钟数据
        #   3. 到点创建 STOP 文件让引擎优雅停机，账本写完整后再退出
        env:
          RUN_HOURS: ${{ github.event.inputs.hours || '5' }}
        run: |
          python cloud_runner.py --hours "$RUN_HOURS" --interval "$ENGINE_INTERVAL" --push-interval 300

      - name: Push State Snapshot
        # 状态推到 state-snapshot 分支（--force，历史恒为 1 个提交，仓库不膨胀）
        if: always()
        run: |
          python sync_state.py push || echo "::warning::状态快照推送失败"

      - name: Publish Dashboard To Pages
        # 把最新面板推到公开面板仓，Pages 自动发布
        if: always()
        env:
          PAGES_TOKEN: ${{ secrets.PAGES_TOKEN }}
          PAGES_REPO: ${{ secrets.PAGES_REPO }}
        run: |
          if [ -z "$PAGES_TOKEN" ] || [ -z "$PAGES_REPO" ]; then
            echo "未配置 Pages secrets，跳过面板发布"
            exit 0
          fi
          rm -rf pages_repo
          git clone --depth 1 "https://x-access-token:${PAGES_TOKEN}@github.com/${PAGES_REPO}.git" pages_repo
          if [ -f dashboard_paper.html ]; then
            cp dashboard_paper.html pages_repo/index.html
          fi
          cd pages_repo
          git config user.name "polymarket-quant-bot"
          git config user.email "bot@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "update paper dashboard $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

      - name: Trigger Next Round
        # 自续跑：立刻触发下一轮，消掉 5 小时 cron 之间的间隙
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOURS: ${{ github.event.inputs.hours || '5' }}
        run: |
          sleep 20
          gh workflow run polymarket_quant.yml --ref master -f hours="$HOURS" \
            || echo "::warning::下一轮触发失败，等待 cron 兜底"
