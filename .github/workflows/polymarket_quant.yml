name: Polymarket Paper Trading (Cloud, 24/7)

# ============================================================================
# 为什么用"长驻 job + 自续跑"，而不是纯 cron
# ----------------------------------------------------------------------------
# GitHub 官方限制：定时 workflow 最短间隔是 5 分钟（cron 下限），
# 写 '*/1 * * * *' 不会被调度 —— GitHub 直接忽略低于 5 分钟的间隔。
# 所以"每分钟一轮"没法只靠 cron 实现。
#
# 方案：cron 每 5 小时触发一次 → job 内部用 quant_engine.py --loop --interval 60
#       连续跑 5 小时（每分钟一轮）→ 结束时用 workflow_dispatch 立刻触发下一轮，
#       形成不断链的自续跑。GitHub 托管 runner 单个 job 最长 6 小时，
#       这里取 5 小时留出安全余量，cron 作为兜底（万一自续跑失败）。
#
# 状态持久化：状态不进 master（master 只放代码，历史干净）。
#       引擎产出的账本/面板通过 sync_state.py 推到独立的 state-snapshot 分支，
#       该分支每次 --force 覆盖，仓库体积恒定，不会随运行时间膨胀。
#
# 安全：PAPER=true + ALLOW_LIVE=false 双保险，云端绝不可能下真单。
# ============================================================================

on:
  schedule:
    # 每 5 小时整点后 7 分钟触发（避开整点高峰，GitHub 建议错开）
    - cron: '7 */5 * * *'
  workflow_dispatch:
    inputs:
      hours:
        description: '本次连续运行多少小时（默认 5）'
        required: false
        default: '5'

# 同一时间只允许一个巡检实例：新一轮必须等上一轮结束，避免账本并发写坏
concurrency:
  group: polymarket-paper-cloud
  cancel-in-progress: false

permissions:
  contents: write
  # 自续跑需要用 GITHUB_TOKEN 触发 workflow_dispatch。
  # 注意：workflow_dispatch 是"GITHUB_TOKEN 触发的 run 不再递归触发"的唯一例外，
  # 所以自续跑链路是通的（push/pull_request 事件则会被 GitHub 拦截）。
  actions: write

jobs:
  paper-loop:
    runs-on: ubuntu-latest
    # 单 job 上限 6 小时；留余量给状态推送与收尾
    timeout-minutes: 330
    env:
      # ---- 纸盘模式：绝不允许真实下单 ----
      PAPER: 'true'
      ALLOW_LIVE: 'false'
      ALLOW_DIRECT: 'true'          # 云端 Runner 无本地代理，允许显式直连
      SCAN_LIMIT: '60'              # 每轮评估的市场数
      ROUND_BUDGET_SECONDS: '240'   # 单轮请求时间预算
      ENGINE_INTERVAL: '60'         # 引擎循环间隔（秒）= 每分钟一轮

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # sync_state 需要读写已有分支

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore State From Snapshot Branch
        # 用 GitHub API 下载快照（不能用 git show：浅克隆下远程跟踪引用
        # 更新不了，会读到过期引用，甚至让引擎以空白账本启动清零持仓）。
        run: |
          mkdir -p state logs
          python fetch_state.py

      - name: Verify Ledger Restored
        # 保险：账本没恢复出来就**拒绝启动引擎**。
        # 空白账本一旦写回快照分支，持仓与净值曲线就永久丢失了。
        run: |
          if [ ! -f state/portfolio_paper.json ]; then
            echo "::error::账本未恢复，拒绝启动引擎（否则会以 \$10 空白账本覆盖真实持仓）"
            exit 1
          fi
          python - <<'PY'
          import json, sys
          data = json.load(open("state/portfolio_paper.json", encoding="utf-8"))
          equity = float(data.get("total_equity_usdc") or 0)
          positions = len(data.get("open_positions") or [])
          print(f"账本校验通过: 净值 ${equity:.2f} | 持仓 {positions} | 更新时间 {data.get('last_updated')}")
          # 有持仓但净值回到初始值 = 明显异常，宁可停下也不写回
          if equity <= 10.0 and positions == 0 and data.get("closed_trades"):
              print("::warning::账本净值异常（可能已被重置），请检查")
          PY

      - name: Run Paper Loop
        # cloud_runner.py 负责四件事：
        #   1. 后台跑 quant_engine.py --loop --interval 60（每分钟一轮）
        #   2. 每 5 分钟推一次状态快照 —— 即使 job 中途崩溃也只丢几分钟数据
        #   3. 每 5 分钟同步发布面板 —— 否则 Pages 会一直停在旧数据、显示"已过期"
        #   4. 到点创建 STOP 文件让引擎优雅停机，账本写完整后再退出
        env:
          RUN_HOURS: ${{ github.event.inputs.hours || '5' }}
          PAGES_REPO: ${{ secrets.PAGES_REPO }}
          PAGES_TOKEN: ${{ secrets.PAGES_TOKEN }}
        run: |
          python cloud_runner.py \
            --hours "$RUN_HOURS" \
            --interval "$ENGINE_INTERVAL" \
            --push-interval 300 \
            --pages-repo "$PAGES_REPO" \
            --pages-token "$PAGES_TOKEN"

      - name: Push State Snapshot
        # 兜底：cloud_runner.py 已在运行期间每 5 分钟推过一次，
        # 这里再推一次，确保 job 异常退出时最新状态也能落地。
        if: always()
        run: |
          python sync_state.py push || echo "::warning::状态快照推送失败"

      - name: Trigger Next Round
        # 自续跑：立刻触发下一轮，消掉 5 小时 cron 之间的间隙。
        # 固定用 5 小时，不继承上一轮的 hours —— 否则测试用的短时长
        # 会被一轮轮继承下去，正式巡检就退化成几分钟一轮。
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sleep 20
          gh workflow run polymarket_quant.yml --ref master -f hours=5 \
            || echo "::warning::下一轮触发失败，等待 cron 兜底"
