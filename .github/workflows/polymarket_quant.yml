name: Polymarket 10U Autonomous Quant Loop

on:
  schedule:
    # 每 10 分钟在云端自动巡检一次 (0 成本)
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: polymarket-quant-single-runner
  cancel-in-progress: false

jobs:
  quant-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Private Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        # PAPER 模式懒加载链上模块，只需这三个第三方包，装得快、跑得稳
        run: |
          python -m pip install --upgrade pip
          pip install requests numpy python-dotenv

      - name: Run Single Quant Cycle (Fail-Closed)
        env:
          WALLET_ADDRESS: ${{ secrets.WALLET_ADDRESS }}
          DEPOSIT_WALLET: ${{ secrets.DEPOSIT_WALLET }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          CLOB_API_KEY: ${{ secrets.CLOB_API_KEY }}
          CLOB_SECRET: ${{ secrets.CLOB_SECRET }}
          CLOB_PASSPHRASE: ${{ secrets.CLOB_PASSPHRASE }}
          # 默认必须是 PAPER。GitHub Runner 与本机不在同一台机器，
          # 因此单实例锁（state/engine.lock）无法阻止两端同时实盘下单。
          # 除非显式在仓库 Secrets 中同时设置 PAPER=false 与 ALLOW_LIVE=true，
          # 否则云端只做只读巡检，绝不提交订单。
          PAPER: ${{ secrets.PAPER || 'true' }}
          ALLOW_LIVE: ${{ secrets.ALLOW_LIVE || 'false' }}
        run: |
          python quant_engine.py

      - name: Persist Portfolio State & Dashboard
        run: |
          git config user.name "polymarket-quant-bot"
          git config user.email "bot@users.noreply.github.com"
          # 先拉取远程最新（本地或其他运行可能推过），减少 push 冲突
          git pull --rebase --autostash || true
          # state/ 与 logs/ 已被 .gitignore 排除，需用 -f 显式加入，
          # 否则 git add 会因 "ignored by one of your .gitignore files" 直接失败。
          # 实盘侧
          git add -f state/portfolio.json dashboard.html || true
          # 纸盘侧（云端唯一写入方）：面板 + 组合 + 净值曲线 + 心跳 + 市场池
          git add -f dashboard_paper.html \
                    state/portfolio_paper.json \
                    state/equity_history_paper.jsonl \
                    state/heartbeat_paper.json \
                    state/market_universe.json \
                    state/scan_rotation.json || true
          # 信号日志（排查云端为什么没下单时用）
          git add -f logs/signals_and_skips.jsonl || true
          git diff --staged --quiet || git commit -m "chore: update quant state [skip ci]"
          git push || (git pull --rebase --autostash && git push) || echo "::warning::push 失败，本轮状态未回传，下轮重试"

      - name: Publish Paper Dashboard to Pages Repo
        # 在仓库 Secrets 里配置 PAGES_REPO（如 designeryork/polymarket-paper-dashboard）
        # 和 PAGES_TOKEN（有该仓写权限的 token）后，此步骤自动生效；
        # 不配置则静默跳过，不影响巡检。
        if: ${{ secrets.PAGES_TOKEN != '' && secrets.PAGES_REPO != '' }}
        run: |
          git clone --depth 1 "https://x-access-token:${{ secrets.PAGES_TOKEN }}@github.com/${{ secrets.PAGES_REPO }}.git" pages_repo
          cp dashboard_paper.html pages_repo/index.html
          cd pages_repo
          git config user.name "polymarket-quant-bot"
          git config user.email "bot@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "update paper dashboard $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
